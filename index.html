const key='family-sphere-premium-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let state={theme:'aurora',accent:null,tab:'chats',filter:'all',chat:null,query:'',profile:{name:'حسابي',bio:'مساحتي الخاصة'},chats:[{id:1,name:'أحمد علي',type:'private',emoji:'👨🏻',unread:2,online:true,messages:[{mine:false,text:'السلام عليكم، شلونك؟',at:'09:30'},{mine:true,text:'وعليكم السلام ورحمة الله',at:'09:32'}]},{id:2,name:'المجلس الأسري',type:'group',emoji:'👨‍👩‍👧‍👦',unread:5,messages:[{mine:false,text:'موعد المجلس اليوم الساعة الثامنة',at:'08:50'}]},{id:3,name:'القرآن الكريم',type:'channel',emoji:'📖',unread:0,messages:[{mine:false,text:'تلاوة جديدة متوفرة',at:'أمس'}]},{id:4,name:'فاطمة حسن',type:'private',emoji:'👩🏻',unread:0,messages:[{mine:false,text:'شكراً جزيلاً لكم 🌷',at:'أمس'}]},{id:5,name:'علوم أهل البيت',type:'channel',emoji:'🕌',unread:0,messages:[{mine:false,text:'درس جديد في السيرة',at:'الأحد'}]}],stories:[],...saved};let modal=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(key,JSON.stringify({...state,query:'',chat:null,tab:'chats'}))}function theme(){let t=themes[state.theme]||themes.aurora;let v=['--accent','--bg','--surface','--text','--muted','--line','--soft'];v.forEach((x,i)=>document.documentElement.style.setProperty(x,i===0&&state.accent?state.accent:t[i+1]));document.body.className=state.theme}function setTheme(id){state.theme=id;state.accent=null;persist();render()}function tab(t){state.tab=t;state.chat=null;state.query='';render()}function filter(f){state.filter=f;render()}function openChat(id){state.chat=id;let c=state.chats.find(x=>x.id===id);c.unread=0;persist();render()}function closeChat(){state.chat=null;render()}function send(){let i=$('#msg');if(!i)return;let val=i.value.trim();if(!val)return;let c=state.chats.find(x=>x.id===state.chat);c.messages.push({mine:true,text:val,at:new k="chooseMedia('audio')"><span>🎵</span>مقطع صوتي</button><button class="media-choice" onclick="chooseMedia('file')"><span>📁</span>ملف</button></div>`:modal==='profile'?`<h2>تعديل الملف الشخصي</h2><input class="field" id="pname" value="${esc(state.profile.name)}" placeholder="الاسم"><textarea class="field" id="pbio" rows="3">${esc(state.profile.bio)}</textarea><button class="primary full" onclick="state.profile={name:document.querySelector('#pname').value,bio:document.querySelector('#pbio').value};persist();shut();render()">حفظ</button>`:modal==='info'?`<h2>معلومات المحادثة</h2><p class="muted">يمكنك تعديل الاسم والوصف محلياً لأغراض التجربة.</p><input class="field" id="cname" value="${esc(state.chats.find(c=>c.id===state.chat)?.name)}"><textarea class="field" id="cdesc" placeholder="الوصف">${esc(state.chats.find(c=>c.id===state.chat)?.desc||'')}</textarea><button class="primary full" onclick="let c=state.chats.find(c=>c.id===state.chat);c.name=document.querySelector('#cname').value;c.desc=document.querySelector('#cdesc').value;persist();shut();render()">حفظ</button>`:'';root.innerHTML=`<div class="overlay" onclick="if(event.target===this)shut()"><div class="sheet"><div class="row space"><span class="eyebrow">FAMILY SPHERE</span><button class="round" onclick="shut()">✕</button></div>${body}</div></div>`}function chatList(){let q=state.query.toLowerCase();let list=state.chats.filter(c=>(state.filter==='all'||(state.filter==='unread'?c.unread>0:c.type===state.filter))&&c.name.toLowerCase().includes(q));return `<div class="card" style="padding:2px 15px">${list.map(c=>`<div class="chatrow" onclick="openChat(${c.id})"><div class="avatar">${c.emoji}</div><div class="grow"><div class="row space"><b class="truncate">${esc(c.name)}</b><span class="time">${esc(c.messages.at(-1)?.at||'جديد')}</span></div><div class="row space" style="margin-top:5px"><span class="muted small truncate">${esc(c.messages.at(-1)?.text||'ابدأ المحادثة')}</span>${c.unread?`<span class="count">${c.unread}</span>`:''}</div></div></div>`).join('')||'<p class="muted small">ماكو نتائج مطابقة</p>'}</div>`}function renderChat(){let c=state.chats.find(x=>x.id===state.chat);if(!c){state.chat=null;return render()}return `<div class="chathead"><button class="round" onclick="closeChat()">→</button><div class="avatar" style="width:44px;height:44px">${c.emoji}</div><div class="grow" onclick="openModal('info')"><b>${esc(c.name)}</b><div class="small muted">${c.online?'● متصل الآن':c.type==='channel'?'قناة':'اضغط لعرض المعلومات'}</div></div><button class="round" onclick="openModal('info')">⋯</button></div><div class="messages">${c.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}${m.media?(m.kind==='image'?`<img class="media" src="${m.media}">`:m.kind==='video'?`<video class="media" src="${m.media}" controls playsinline preload="metadata"></video>`:m.kind==='audio'?`<audio class="audio-player" src="${m.media}" controls preload="metadata"></audio>`:`<a href="${m.media}" download="${esc(m.text)}">تحميل الملف</a>`):''}<div class="meta">${esc(m.at)} ${m.mine?'✓✓':''}</div></div>`).join('')||'<div class="notice">هذه بداية المحادثة التجريبية.</div>'}</div><div class="composer"><button class="round" onclick="mediaMenu()" title="إرسال صورة أو فيديو أو صوت أو ملف">＋</button><input id="mediaInput" class="hide" type="file" onchange="fileSend(event)"><button id="recordBtn" title="تسجيل رسالة صوتية" onclick="toggleRecord()">🎙</button><input id="msg" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div><p class="muted small" style="text-align:center">الرسائل هنا تجريبية ومحفوظة على هذا الجهاز فقط.</p>`}function header(title,sub){return `<header class="top"><div><div class="eyebrow">FAMILY SPHERE · شبكة الأسرة الشيعية</div><div class="heading">${title}</div><div class="muted small">${sub}</div></div><button class="round" onclick="tab('profile')">◉</button></header>`}function chats(){return `${header('المحادثات','مساحة تواصل أكثر هدوءاً وتنظيماً')}<div class="search">⌕ <input id="search" value="${esc(state.query)}" placeholder="ابحث عن محادثة أو شخص..." oninput="state.query=this.value;document.querySelector('#chatresults').innerHTML=chatList()"></div><div class="sectiontitle row space"><span>اللحظات</span><button class="pill" onclick="openModal('story')">＋ أضف حالة</button></div><div class="storyline"><button class="story" onclick="openModal('story')"><div class="avatar">＋</div>قصتي</button>${state.stories.filter(s=>Date.now()-s.at<86400000).map(s=>`<button class="story" onclick="alert(${JSON.stringify('حالتك: '+s.text)})"><div class="avatar">✨</div>حالتي</button>`).join('')}<div class="story"><div class="avatar">🌸</div>فاطمة</div><div class="story"><div class="avatar">🕌</div>المجلس</div></div><div class="chips">${[['all','الكل'],['private','الخاص'],['group','المجموعات'],['channel','القنوات'],['unread','غير المقروءة']].map(([v,l])=>`<button class="chip ${state.filter===v?'active':''}" onclick="filter('${v}')">${l}</button>`).join('')}</div><div id="chatresults">${chatList()}</div><button class="fab" onclick="openModal('new')">＋</button>`}function communities(){return `${header('المجتمعات','قنوات ومساحات منظّمة')}<div class="hero"><div class="eyebrow" style="color:white">COMMUNITY HUB</div><h2>مساحات تجمعنا</h2><p>قنوات تعليمية ومجالس ومجموعات، بهوية خاصة لكل مجتمع.</p></div><div class="sectiontitle">القنوات الرسمية</div><div class="card">${[['📣','شبكة الأسرة الشيعية الرسمية'],['📖','القرآن الكريم'],['🕌','علوم أهل البيت'],['🌷','الأسرة والتربية'],['🧸','عالم الطفل الشيعي'],['🎓','الحوزة العلمية'],['🧠','الصحة النفسية'],['🗓️','المناسبات الإسلامية']].map(([i,n])=>`<div class="tile"><div class="avatar">${i}</div><div class="grow"><b>${n}</b><div class="muted small">قناة مقترحة · غير متصلة بالخادم</div></div><span class="pill">رسمي</span></div>`).join('')}</div><button class="primary full" onclick="openModal('new')">＋ إنشاء قناة أو مجموعة</button>`}function moments(){return `${header('اللحظات','قصص ومحتوى من المجتمع')}<div class="hero"><div class="eyebrow" style="color:white">MOMENTS</div><h2>شارك لحظتك</h2><p>قصص، صور، فيديوهات وتجارب المجتمع.</p><button class="btn" onclick="openModal('story')">＋ أنشئ لحظة</button></div><div class="sectiontitle">حالاتي</div>${state.stories.filter(s=>Date.now()-s.at<86400000).map(s=>`<div class="card"><div class="row"><div class="avatar">✨</div><b>${esc(state.profile.name)}</b><span class="muted small">حالة محلية</span></div><p>${esc(s.text)}</p></div>`).join('')||'<div class="notice">ما نشرت أي حالة بعد. الحالات تنتهي بعد 24 ساعة على هذا الجهاز.</div>'}<div class="sectiontitle">استكشف المحتوى</div><div class="card"><div class="avatar">🎬</div><h3>مساحة الفيديوهات القصيرة</h3><p class="muted small">واجهة تجريبية — نشر الفيديو ومشاهدته بين المستخدمين يحتاج تخزيناً سحابياً.</p></div>`}function discover(){return `${header('اكتشف','كل ما يهمك في مكان واحد')}<div class="hero"><div class="eyebrow" style="color:white">DISCOVER</div><h2>مجتمعات ومعرفة</h2><p>ابحث عن القنوات، الأشخاص والمجموعات العامة.</p></div><div class="sectiontitle">الأقسام المقترحة</div><div class="card">${[['📚','التعليم والحوزات'],['🧡','الأسرة والتربية'],['🌿','الصحة النفسية'],['🎙️','المجالس الصوتية'],['📰','الأخبار والفعاليات']].map(([i,n])=>`<div class="tile"><div class="avatar">${i}</div><b>${n}</b><span class="muted small" style="margin-right:auto">قريباً</span></div>`).join('')}</div>`}function profile(){return `${header('مساحتي','هويتي، خصوصيتي، مظهري')}<div class="hero"><div class="row"><div class="avatar" style="background:#ffffff30;color:white">👤</div><div><h2 style="margin:0">${esc(state.profile.name)}</h2><p>${esc(state.profile.bio)}</p></div></div><button class="btn" onclick="openModal('profile')">تعديل الملف الشخصي</button></div><div class="sectiontitle">استوديو المظهر · 9 تصاميم</div><div class="notice">كل تصميم يغيّر لوحة الألوان والبطاقات والحدود وبعض تفاصيل التخطيط. يمكنك اختيار لون إضافي مستقل.</div><div class="themegrid" style="margin-top:12px">${Object.entries(themes).map(([id,t])=>`<button class="theme ${state.theme===id?'selected':''}" onclick="setTheme('${id}')"><div class="preview" style="background:${t[2]}"><span style="background:${t[1]}"></span><span style="background:${t[3]}"></span><span style="background:${t[1]}"></span></div><b style="font-size:12px">${t[0]}</b>${state.theme===id?' <span style="color:var(--accent)">✓</span>':''}</button>`).join('')}</div><div class="sectiontitle">لونك المفضل</div><div class="card"><div class="swatches">${['#3478ee','#168f85','#9b6ee5','#c38c4a','#d35b75','#242d42'].map(c=>`<button class="swatch" style="background:${c}" onclick="state.accent='${c}';persist();render()" aria-label="اختيار لون ${c}"></button>`).join('')}<label class="swatch" style="display:grid;place-items:center;overflow:hidden">🎨<input type="color" style="opacity:0;position:absolute;width:30px" onchange="state.accent=this.value;persist();render()"></label></div></div><div class="sectiontitle">الإعدادات</div><div class="card"><div class="tile">🔐 <b>الخصوصية والأمان</b><span class="muted small" style="margin-right:auto">قيد التطوير</span></div><div class="tile">✓ <b>طلب توثيق الحساب</b><span class="muted small" style="margin-right:auto">قيد التطوير</span></div><div class="tile">🌐 <b>اللغة</b><span class="muted small" style="margin-right:auto">العربية</span></div></div>`}function render(){theme();let content=state.chat?renderChat():({chats,communities,moments,discover,profile}[state.tab]||chats)();$('#app').innerHTML=content+`<nav class="bottom">${[['chats','◉','المحادثات'],['communities','♧','المجتمعات'],['moments','◈','اللحظات'],['discover','⌕','اكتشف'],['profile','♙','حسابي']].map(([t,i,l])=>`<button class="nav ${state.tab===t&&!state.chat?'active':''}" onclick="tab('${t}')"><span class="ico">${i}</span>${l}</button>`).join('')}</nav>`;renderModal()}render();
</script></body></html>
